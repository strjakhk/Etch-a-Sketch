<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-A-Sketch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        Etch A Sketch
    </header>
    <main>
        <section class="controls">
            <div class="color-picker">
                <input type="color" id="color-1">
                <input type="color" id="color-2">
            </div>
            <button id="pincel">Pincel</button>
            <button id="eraser">Eraser</button>
            <button id="clear">Clear</button>
        </section>
        
        <section class="board">
            <div class="container">
                <!-- grid of squares -->
            </div>
            <div class="size">
                <input
                    type="range"
                    id="size" 
                    min="16" 
                    max="96" 
                    value="16" 
                    step="16"
                    list="values"
                >
                <p><output id="size-value">16 x 16</output></p>            
            </div>
        </section>
    </main>
    <footer>

    </footer>

<script src="./main.js"></script>
</body>
</html>
