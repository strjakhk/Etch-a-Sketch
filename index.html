<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-A-Sketch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="controls">
            
        </section>
        <section class="container">
            <!-- grid of squares -->
        </section>
        <section class="size">
            <input
                type="range"
                id="size" 
                min="16" 
                max="96" 
                value="16" 
                step="16"
                list="values"
            >
            <p><output id="size-value">16 x 16</output></p>
            
        </section>
    </main>

<script src="./main.js"></script>
</body>
</html>
